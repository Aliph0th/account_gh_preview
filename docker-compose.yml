services:
   tokens-bot:
      build:
         context: .
         dockerfile: Dockerfile
      container_name: tokens
      ports:
         - '127.0.0.1:8080:8080'
      environment:
         TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      volumes:
         - tokens-data:/app/data
      restart: unless-stopped
      healthcheck:
         test:
            [
               'CMD',
               'wget',
               '--no-verbose',
               '--tries=1',
               '--spider',
               'http://localhost:8080/'
            ]
         interval: 30s
         timeout: 3s
         retries: 3
         start_period: 5s

volumes:
   tokens-data:
      driver: local
